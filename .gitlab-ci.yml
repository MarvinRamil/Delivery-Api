    - echo "Review app is live at https://${VIRTUAL_HOST}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stop:review:
  stage: deploy
  image: docker:latest
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    # The branch is usually already deleted by the time this runs.
    GIT_STRATEGY: none
    RABBITMQ_CONTAINER: "beeapp-rabbitmq"
  # Deliberately NO `needs: prepare:env:review`. GitLab can trigger this weeks later, on merge or
  # branch delete or the auto_stop timer, by which point that job's artifacts may have expired -
  # and a teardown that cannot name what it should delete leaves the container running forever.
  # Every name below is derived from the MR id instead, so this job is self-sufficient.
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    action: stop
  script:
    - |
      # CI_MERGE_REQUEST_IID is normally present; fall back to the environment name (review/<iid>)
      # for the auto-triggered case, where the MR context is not always populated.
      IID="${CI_MERGE_REQUEST_IID:-${CI_ENVIRONMENT_NAME##*/}}"
      if [ -z "$IID" ]; then
        echo "Cannot determine the MR id, so cannot identify what to tear down."
        exit 1
      fi
      echo "Tearing down the review app for MR !${IID}..."

      docker rm -f "beeapp-backend-review-${IID}" || true
      docker rmi "${DOCKER_IMAGE_NAME}:mr-${IID}" || true
      docker exec "${RABBITMQ_CONTAINER}" rabbitmqctl delete_vhost "review-${IID}" || true

      # Safe unconditionally: bee_review_<iid> exists only if this MR owned a database. An MR that
      # shared bee_logistics_db_dev never created one, so this is a no-op for it - and because the
      # name is DERIVED rather than passed in, it can never resolve to the shared dev database.
      docker run --rm -e PGPASSWORD="${POSTGRES_PASSWORD}" postgres:17-alpine \
        psql -h "${POSTGRES_HOST}" -U "${POSTGRES_USER}" -d postgres \
        -c "DROP DATABASE IF EXISTS \"bee_review_${IID}\" WITH (FORCE);" || true

      echo "Review app for MR !${IID} removed"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

secrets:scan:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  needs: []
  script:
    - gitleaks detect --source . --no-git --verbose
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "dev"

checkov:iac:
  stage: security
  image:
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  needs: []
  script:
    - checkov -d . --framework dockerfile --output cli --soft-fail --skip-path docker/liveness
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "dev"

# Dockerfile best-practices / hardening lint (Hadolint). Report-only.
dockerfile:lint:
  stage: security
  image:
    name: hadolint/hadolint:latest-alpine
    entrypoint: [""]
  needs: []
  script:
    - hadolint --failure-threshold error Dockerfile Dockerfile.ci Dockerfile.dev
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "dev"

# Filesystem scan of the repo: dependency vulns + IaC misconfig + secrets (Trivy). Report-only.
fs:scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: []
  script:
    - trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 0 --no-progress --skip-dirs docker/liveness .
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# BUILD STAGES
# ============================================

# The only job that restores. Everything downstream runs --no-restore and gets the
# packages from the cache plus the project.assets.json files from this job's artifacts.
restore:
  stage: restore
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_IMAGE_TAG}
  script:
    - echo "Restoring NuGet packages..."
    # Target dir comes from $NUGET_PACKAGES so there is a single knob to change if the
    # packages move to a host bind mount.
    - dotnet restore $SOLUTION_FILE
  artifacts:
    # obj/ at this point holds only the restore output (project.assets.json,
    # *.nuget.g.props/targets) — a few hundred KB, not build output.
    paths:
      - "**/obj/"
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "dev"

# Whole-solution compile, kept as a safety net only: it catches any project that is in
# the .sln but not reachable from either the API or the test graph. Today that set is
# empty (the .sln is in fact stale — it lists 14 projects while the API alone references
# 17 modules), so this job is currently redundant with publish+test. It is cheap to keep
# because it no longer sits on the critical path: it produces no artifacts and runs in
# parallel with test/sast/publish rather than ahead of them.
build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_IMAGE_TAG}
  needs:
    - job: restore
      artifacts: true
  before_script: *dotnet_restore_guard
  script:
    - echo "Building solution..."
    - dotnet build $SOLUTION_FILE --configuration Release --no-restore
    - echo "Build completed successfully!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# TEST STAGE - Unit tests + coverage (xUnit + Coverlet)
# ============================================
# NOTE: this job is a real gate (no allow_failure) — a failing test blocks the
# pipeline (and therefore the manual deploy). Set allow_failure: true to make it report-only.
test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_IMAGE_TAG}
  needs:
    - job: restore
      artifacts: true
  before_script: *dotnet_restore_guard
  script:
    - echo "Running unit tests with coverage..."
    # --settings applies coverlet.runsettings, which excludes **/Migrations/** and the test
    # assemblies. Without it those exclusions were ignored and the reported coverage was diluted
    # by generated migration code that no one tests.
    - dotnet test $TEST_PROJECT --configuration Release --no-restore --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger "console;verbosity=normal"
  coverage: '/Total\s*\|\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    paths:
      - ./TestResults/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: "**/coverage.cobertura.xml"
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# SAST STAGE - Vulnerable NuGet packages + Semgrep source analysis
# ============================================

sast:
  stage: sast
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_IMAGE_TAG}
  # `dotnet list package --vulnerable` reads project.assets.json, so it needs the
  # restore output only — waiting on a full build was pure dead time.
  needs:
    - job: restore
      artifacts: true
  before_script: *dotnet_restore_guard
  script:
    - echo "Running SAST security scan for .NET..."
    - echo "Checking for vulnerable NuGet packages..."
    - dotnet list $SOLUTION_FILE package --vulnerable --include-transitive
    - echo "SAST scan completed."
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "dev"

# Static analysis of C# source code (Semgrep, free community rulesets). Report-only.
# Run via pip on a plain Python image — the official Semgrep image expects the code
# mounted at /src, which the GitLab runner does not do.
semgrep:sast:
  stage: sast
  image: python:3.12-slim
  needs: []
  script:
    - echo "Installing Semgrep..."
    - pip install --quiet --disable-pip-version-check semgrep
    - echo "Running Semgrep SAST..."
    - semgrep scan --config p/csharp --config p/security-audit --config p/secrets --config p/dockerfile --metrics off --disable-version-check --exclude docker/liveness .
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "dev"

publish:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_IMAGE_TAG}
  needs:
    - job: restore
      artifacts: true
  before_script: *dotnet_restore_guard
  script:
    - echo "Publishing API project..."
    - dotnet publish $API_PROJECT --configuration Release --no-restore --output $PUBLISH_OUTPUT_DIR
    - echo "Publish completed!"
    - ls -la $PUBLISH_OUTPUT_DIR
  artifacts:
    paths:
      - $PUBLISH_OUTPUT_DIR/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# DOCKER BUILD STAGES
# ============================================

docker:build:dev:
  stage: docker
  image: docker:latest
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  needs:
    - job: publish
      artifacts: true
    - job: prepare:env:dev
      artifacts: true
  script:
    - echo "Building Docker image for DEV..."
    # Dockerfile.ci is runtime-only and takes the publish output as its build context,
    # so this no longer restores/builds the solution a second time inside Docker.
    - docker build -f Dockerfile.ci --build-arg DOTNET_IMAGE_TAG=${DOTNET_IMAGE_TAG} -t ${DOCKER_IMAGE_NAME}:${DOCKER_TAG} -t ${DOCKER_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}-dev ${PUBLISH_OUTPUT_DIR}
    - echo "Docker image built successfully!"
    - docker images | grep ${DOCKER_IMAGE_NAME}
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# Trivy and Syft are report-only, so they run alongside deploy:dev instead of
# holding the image hostage on the way to it.
trivy:image:dev:
  stage: docker
  image: docker:latest
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  needs:
    - job: docker:build:dev
    - job: prepare:env:dev
      artifacts: true
  script:
    - echo "Running Trivy CVE scan..."
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --exit-code 0 --severity CRITICAL,HIGH ${DOCKER_IMAGE_NAME}:${DOCKER_TAG}
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

sbom:dev:
  stage: docker
  image: docker:latest
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  needs:
    - job: docker:build:dev
    - job: prepare:env:dev
      artifacts: true
  script:
    - echo "Generating SBOM with Syft..."
    - docker run --rm -e DOCKER_HOST=unix:///var/run/docker.sock -v /var/run/docker.sock:/var/run/docker.sock -v $(pwd):/output anchore/syft docker:${DOCKER_IMAGE_NAME}:${DOCKER_TAG} -o spdx-json=/output/sbom-dev.spdx.json
  allow_failure: true
  artifacts:
    when: always
    paths:
      - sbom-dev.spdx.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

docker:build:staging:
  stage: docker
  image: docker:latest
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  needs:
    - job: publish
      artifacts: true
    - job: prepare:env:staging
      artifacts: true
  script:
    - echo "Building Docker image for STAGING..."
    - docker build -t ${DOCKER_IMAGE_NAME}:${DOCKER_TAG} -t ${DOCKER_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}-staging .
    - echo "Docker image built successfully!"
    - docker images | grep ${DOCKER_IMAGE_NAME}
    - echo "Running Trivy CVE scan..."
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --exit-code 0 --severity CRITICAL,HIGH ${DOCKER_IMAGE_NAME}:${DOCKER_TAG} || true
    - echo "Generating SBOM with Syft..."
    - docker run --rm -e DOCKER_HOST=unix:///var/run/docker.sock -v /var/run/docker.sock:/var/run/docker.sock -v $(pwd):/output anchore/syft docker:${DOCKER_IMAGE_NAME}:${DOCKER_TAG} -o spdx-json=/output/sbom-staging.spdx.json
  artifacts:
    when: always
    paths:
      - sbom-staging.spdx.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

docker:build:production:
  stage: docker
  image: docker:latest
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  needs:
    - job: publish
      artifacts: true
    - job: prepare:env:production
      artifacts: true
  script:
    - echo "Building Docker image for PRODUCTION..."
    - docker build -t ${DOCKER_IMAGE_NAME}:${DOCKER_TAG} -t ${DOCKER_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}-prod .
    - echo "Docker image built successfully!"
    - docker images | grep ${DOCKER_IMAGE_NAME}
    - echo "Running Trivy CVE scan..."
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --exit-code 0 --severity CRITICAL,HIGH ${DOCKER_IMAGE_NAME}:${DOCKER_TAG} || true
    - echo "Generating SBOM with Syft..."
    - docker run --rm -e DOCKER_HOST=unix:///var/run/docker.sock -v /var/run/docker.sock:/var/run/docker.sock -v $(pwd):/output anchore/syft docker:${DOCKER_IMAGE_NAME}:${DOCKER_TAG} -o spdx-json=/output/sbom-production.spdx.json
  artifacts:
    when: always
    paths:
      - sbom-production.spdx.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================
# DEPLOY STAGES - Manual deployment (play button)
# ============================================

deploy:dev:
  stage: deploy
  image: docker:latest
  variables:
    # Per-environment constants for the deploy, kept OUT of the dotenv artifact on purpose:
    # GitLab caps dotenv artifacts at 20 variables and prepare:env:dev was over it. These are
    # fixed values for this environment rather than anything prepare computes, so a job-level
    # variable is the right home for them and is not subject to that limit.
    MATRIX_SERVER_NAME: "matrix.bee-app.tech"
    MATRIX_PUBLIC_HOMESERVER_URL: "https://matrix.bee-app.tech"
    MATRIX_ENVIRONMENT_PREFIX: "dev"
      # Public hostname, not the LAN address, even though dev is on-prem: dev should exercise
      # the same path production uses so the cutover reproduces a proven configuration.
    MATRIX_HOMESERVER_URL: "https://matrix.bee-app.tech"
    MATRIX_APPSERVICE_ID: "bee-appservice-dev"
    MATRIX_SENDER_LOCALPART: "bee-dev"
      # The admin API only: /_synapse/* is blocked at the proxy in front of matrix.bee-app.tech,
      # so booking-chat-purge talks to the host directly. Everything else keeps the public path.
    MATRIX_ADMIN_API_URL: "http://10.10.10.152:8008"
    RABBITMQ_VHOST: "dev"
    REDIS_DB: "1"
    SIGNALR_CHANNEL_PREFIX: "BeeLogistics:signalr:dev:"
    DOCKER_HOST: unix:///var/run/docker.sock
  needs:
    - job: docker:build:dev
    - job: prepare:env:dev
      artifacts: true
  script:
    - echo "=========================================="
    - echo "Deploying to DEV environment"
    - echo "Database - $POSTGRES_DB"
    - echo "Port - $API_PORT"
    - echo "Container - $CONTAINER_NAME"
    - 'echo "MQTT configured - Host: ${MQTT_HOST:-NOT_SET}, Port: ${MQTT_PORT:-NOT_SET}"'
    - echo "=========================================="
    - echo "Creating network if not exists..."
    - docker network create beeapp-network || true
    - echo "Starting shared Redis (default port) if not running..."
    - docker start ${REDIS_CONTAINER} || docker run -d --name ${REDIS_CONTAINER} --restart unless-stopped --network beeapp-network redis:7-alpine redis-server --appendonly yes --port ${REDIS_PORT} --requirepass "${REDIS_PASSWORD:-}"
    - echo "Starting RabbitMQ for DEV if not running..."
    - docker start ${RABBITMQ_CONTAINER} || docker run -d --name ${RABBITMQ_CONTAINER} --restart unless-stopped --network beeapp-network -e RABBITMQ_DEFAULT_USER=${RABBITMQ_USER} -e RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD} rabbitmq:3-management
    - echo "Ensuring the RabbitMQ vhost for this deployment exists..."
    # Idempotent: add_vhost fails when it already exists, which is the normal case on redeploy.
    # MassTransit creates its own exchanges and queues inside the vhost; only the vhost and its
    # permissions have to pre-exist.
    - docker exec ${RABBITMQ_CONTAINER} rabbitmqctl add_vhost "${RABBITMQ_VHOST}" || true
    - |
      # Grant the new vhost to every user that actually exists in the broker.
      #
      # NOT ${RABBITMQ_USER}: that only seeds RABBITMQ_DEFAULT_USER on a container's FIRST boot,
      # and beeapp-rabbitmq is long-lived, so it need not name a real user. The app takes its real
      # credentials from Vault (RabbitMQ__Username/Password), which CI cannot see. Granting every
      # existing user covers whichever one the app authenticates as, without CI holding secrets.
      #
      # --no-table-headers matters: `-q` alone suppresses the "Listing users ..." banner but still
      # prints the column header, so parsing without it tries to grant to a user called "user".
      RMQ="docker exec ${RABBITMQ_CONTAINER} rabbitmqctl"
      USERS=$($RMQ -q --no-table-headers list_users 2>/dev/null | awk '{print $1}' | grep -v '^$' || true)
      if [ -z "$USERS" ]; then
        # Older rabbitmqctl without --no-table-headers: drop the header row instead.
        USERS=$($RMQ -q list_users | awk 'NR>1 {print $1}' | grep -v '^$' || true)
      fi
      if [ -z "$USERS" ]; then
        echo "Could not list RabbitMQ users, so cannot grant access to vhost '${RABBITMQ_VHOST}'."
        echo "Grant manually: rabbitmqctl set_permissions -p ${RABBITMQ_VHOST} <user> '.*' '.*' '.*'"
        exit 1
      fi
      echo "Users in broker: $(echo $USERS | tr '\n' ' ')"
      GRANTED=0
      for u in $USERS; do
        if $RMQ set_permissions -p "${RABBITMQ_VHOST}" "$u" ".*" ".*" ".*"; then
          GRANTED=$((GRANTED+1))
        else
          # One odd account must not block the deploy; only a total failure is fatal.
          echo "WARNING: could not grant '$u' on '${RABBITMQ_VHOST}'; continuing"
        fi
      done
      if [ "$GRANTED" -eq 0 ]; then
        echo "No user could be granted access to vhost '${RABBITMQ_VHOST}'. The app would start and"
        echo "fail to reach the broker, so failing here instead."
        exit 1
      fi
      echo "Granted $GRANTED user(s) on vhost '${RABBITMQ_VHOST}'"
    - echo "Stopping existing container if any..."
    - docker stop ${CONTAINER_NAME} || true
    - docker rm ${CONTAINER_NAME} || true
    - echo "Starting new container (SECRETS are fetched from Vault via Vault__RoleId/Vault__SecretId)..."
    - |
      # Delivery modes (#67) are ENABLED on dev so QA can exercise pricing, dispatch and
      # ranking. Each value below is a CI variable with an inline default, so retuning is a
      # variable change plus a re-run of this job -- not a code change. See
      # docs/BOOKING_DELIVERY_MODES.md sections 7 and 9. Two limits are not free choices:
      # offer TTLs must not go below many=1/few=2 (a 30s expiry grace is applied twice), and
      # MODE_POOLING_MAX_BROADCAST_MINUTES feeds three read sites that must agree.
      # Pricing (#73): the rate card IS the Pooling price and the faster tiers mark it up, so the
      # pooling discount is 0. PLATFORM_COMMISSION_RATE is a FRACTION (0.05 = 5%) and startup
      # validation now refuses anything outside 0..1. Vault overrides all of these.
      # NOTE: comments must stay OUTSIDE the `docker run ... \` continuation below. A "#" line
      # after a trailing backslash ends the command there, silently dropping every remaining
      # argument including the image. That is exactly how this job broke.
      # Matrix booking chat. Endpoints only -- AsToken/HsToken/AdminToken come from Vault
      # (bee/config) and would be a secret in a CI variable otherwise. Ships disabled: the
      # startup guard only demands the tokens once MATRIX_ENABLED is true.
      #
      # MATRIX_HOMESERVER_URL has NO inline default on purpose. Synapse runs on its own VM, not
      # as a container on this network, so a container-name fallback would be unreachable -- and
      # it would still satisfy the startup validation, turning a missing variable into a silent
      # "no booking ever gets a chat room". Unset leaves it empty, which fails fast instead.
      docker run -d --name ${CONTAINER_NAME} --restart unless-stopped -p ${API_PORT}:8080 \
        -e ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT} -e ASPNETCORE_URLS=http://+:8080 \
        -e "Vault__Address=${VAULT_ADDRESS}" -e "Vault__RoleId=${VAULT_ROLE_ID}" -e "Vault__SecretId=${VAULT_SECRET_ID}" -e "Vault__SkipTlsVerify=${VAULT_SKIP_TLS_VERIFY:-true}" \
        -e "Cors__AllowedOrigins__0=${FRONTEND_URL}" -e "Cors__AllowedOrigins__1=${BACKOFFICE_URL}" -e "Cors__AllowedOrigins__2=${FRONTEND_URL_DEV}" -e "Cors__AllowedOrigins__3=${BACKOFFICE_URL_DEV}" -e "Cors__AllowedOrigins__4=${API_URL}" \
        -e "ConnectionStrings__Redis=${REDIS_CONTAINER}:${REDIS_PORT}${REDIS_PASSWORD:+,password=${REDIS_PASSWORD}}${REDIS_DB:+,defaultDatabase=${REDIS_DB}}" -e "Redis__ConnectionString=${REDIS_CONTAINER}:${REDIS_PORT}${REDIS_PASSWORD:+,password=${REDIS_PASSWORD}}${REDIS_DB:+,defaultDatabase=${REDIS_DB}}" \
        -e "JwtSettings__Issuer=${JWT_ISSUER}" -e "JwtSettings__Audience=${JWT_AUDIENCE}" -e "JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES}" \
        -e "Email__Host=${EMAIL_HOST}" -e "Email__Port=${EMAIL_PORT}" -e "Email__Username=${EMAIL_USERNAME}" -e "Email__From=${EMAIL_FROM}" -e "Email__UseSsl=${EMAIL_USE_SSL}" \
        -e "Payments__ActiveGateway=${PAYMENTS_ACTIVE_GATEWAY:-paymongo}" \
        -e "PayMongo__BaseUrl=${PAYMONGO_BASE_URL:-https://api.paymongo.com/}" \
        -e "PayMongo__CheckoutSuccessUrl=${PAYMONGO_CHECKOUT_SUCCESS_URL}" -e "PayMongo__CheckoutCancelUrl=${PAYMONGO_CHECKOUT_CANCEL_URL}" \
        -e "PayMongo__DefaultTransferProvider=${PAYMONGO_TRANSFER_PROVIDER:-instapay}" \
        -e "Xendit__BaseUrl=${XENDIT_BASE_URL:-https://api.xendit.co/}" \
        -e "RabbitMQ__Host=${RABBITMQ_CONTAINER}" -e "RabbitMQ__Port=${RABBITMQ_PORT}" -e "RabbitMQ__VirtualHost=${RABBITMQ_VHOST}" -e "SignalR__ChannelPrefix=${SIGNALR_CHANNEL_PREFIX}" \
        -e "Mqtt__Host=${MQTT_HOST}" -e "Mqtt__Port=${MQTT_PORT}" -e "Mqtt__UseSsl=${MQTT_USE_SSL}" -e "Mqtt__IgnoreCertificateErrors=${MQTT_IGNORE_CERTIFICATE_ERRORS}" -e "Mqtt__Environment=${MQTT_ENV}" -e "Mqtt__LocationTopic=${MQTT_LOCATION_TOPIC}" \
        -e "ClamAV__Enabled=${CLAMAV_ENABLED:-true}" -e "ClamAV__Host=${CLAMAV_HOST:-localhost}" -e "ClamAV__Port=${CLAMAV_PORT:-3310}" -e "ClamAV__TimeoutSeconds=${CLAMAV_TIMEOUT_SECONDS:-30}" \
        -e "S3__Endpoint=${S3_ENDPOINT:-}" -e "S3__CdnEndpoint=${S3_CDN_ENDPOINT:-}" -e "S3__Region=${S3_REGION:-auto}" -e "S3__UseSSL=${S3_USE_SSL:-true}" -e "S3__BucketName=${S3_BUCKET_NAME:-}" -e "S3__ObjectKeyPrefix=${S3_OBJECT_KEY_PREFIX:-}" \
        -e "DigitalOcean__Endpoint=${DIGITALOCEAN_ENDPOINT:-}" -e "DigitalOcean__CdnEndpoint=${DIGITALOCEAN_CDN_ENDPOINT:-}" -e "DigitalOcean__Region=${DIGITALOCEAN_REGION:-sgp1}" -e "DigitalOcean__UseSSL=${DIGITALOCEAN_USE_SSL:-true}" -e "DigitalOcean__BucketName=${DIGITALOCEAN_BUCKET_NAME:-}" -e "DigitalOcean__ObjectKeyPrefix=${DIGITALOCEAN_OBJECT_KEY_PREFIX:-}" \
        -e "FileStorage__Provider=${FILE_STORAGE_PROVIDER:-DigitalOcean}" \
        -e "Zammad__BaseUrl=${ZAMMAD_BASE_URL:-http://10.10.10.91:9080}" -e "Zammad__Enabled=${ZAMMAD_ENABLED:-true}" \
        -e "Matrix__Enabled=${MATRIX_ENABLED:-false}" -e "Matrix__HomeserverUrl=${MATRIX_HOMESERVER_URL}" -e "Matrix__PublicHomeserverUrl=${MATRIX_PUBLIC_HOMESERVER_URL:-}" -e "Matrix__ServerName=${MATRIX_SERVER_NAME:-}" -e "Matrix__EnvironmentPrefix=${MATRIX_ENVIRONMENT_PREFIX:-}" -e "Matrix__AppServiceId=${MATRIX_APPSERVICE_ID:-}" -e "Matrix__SenderLocalpart=${MATRIX_SENDER_LOCALPART:-}" -e "Matrix__AdminApiUrl=${MATRIX_ADMIN_API_URL:-}" \
        -e "SEQ_SERVER_URL=${SEQ_SERVER_URL:-}" \
        -e "Sentry__Dsn=${SENTRY_DSN:-}" -e "SENTRY_RELEASE=${CI_COMMIT_SHORT_SHA}" \
        -e "Serilog__MinimumLevel__Override__Sentry=${SERILOG_SENTRY_LEVEL:-Warning}" \
        -e "Sms__Providers__IlocosSms__ApiBaseUrl=${SMS_ILOCOS_API_BASE_URL:-https://sms.ilocosscript.live}" -e "Sms__Providers__PhilSMS__ApiBaseUrl=${PHILSMS_API_BASE_URL:-https://dashboard.philsms.com/api/v3}" -e "Sms__Providers__PhilSMS__SenderId=${PHILSMS_SENDER_ID:-BeeOnDemand}" \
        -e "PhilSMS__ApiBaseUrl=${PHILSMS_API_BASE_URL:-https://dashboard.philsms.com/api/v3}" -e "PhilSMS__SenderId=${PHILSMS_SENDER_ID:-BeeOnDemand}" \
        -e "BookingSettings__ProximityRadiusKm=${PROXIMITY_RADIUS_KM:-35}" \
        -e "BookingSettings__ScheduledClaimLeadMinutes=${SCHEDULED_CLAIM_LEAD_MINUTES:-45}" \
        -e "BookingSettings__MaxActiveBookingsPerDriver=${MAX_ACTIVE_BOOKINGS_PER_DRIVER:-3}" \
        -e "BookingSettings__MaxScheduledClaimsPerDriver=${MAX_SCHEDULED_CLAIMS_PER_DRIVER:-5}" \
        -e "DriverWallet__PlatformCommissionRate=${PLATFORM_COMMISSION_RATE:-0.05}" \
        -e "Pricing__DeliveryModes__Regular__Multiplier=${MODE_REGULAR_MULTIPLIER:-1.05}" \
        -e "Pricing__DeliveryModes__OnDemand__Multiplier=${MODE_ONDEMAND_MULTIPLIER:-1.25}" \
        -e "Pricing__DeliveryModes__OnDemand__FlatFee=${MODE_ONDEMAND_FLAT_FEE:-0}" \
        -e "Pricing__DeliveryModes__OnDemand__MinFee=${MODE_ONDEMAND_MIN_FEE:-20}" \
        -e "Pricing__DeliveryModes__OnDemand__MaxFee=${MODE_ONDEMAND_MAX_FEE:-500}" \
        -e "Pricing__DeliveryModes__Pooling__DiscountRate=${MODE_POOLING_DISCOUNT_RATE:-0}" \
        -e "Pricing__DeliveryModes__Pooling__MaxDiscount=${MODE_POOLING_MAX_DISCOUNT:-0}" \
        -e "Pricing__FareTrust__Enforce=${FARE_TRUST_ENFORCE:-false}" \
        -e "Pricing__FareTrust__ToleranceAbsolute=${FARE_TRUST_TOLERANCE_ABSOLUTE:-25.00}" \
        -e "Pricing__FareTrust__ToleranceRate=${FARE_TRUST_TOLERANCE_RATE:-0.10}" \
        -e "BookingSettings__MaxBookingsPerPulseTick=${MAX_BOOKINGS_PER_PULSE_TICK:-200}" \
        -e "BookingSettings__DeliveryModes__OnDemand__H3InitialSearchRadiusKm=${MODE_ONDEMAND_H3_INITIAL_KM:-7}" \
        -e "BookingSettings__DeliveryModes__OnDemand__H3MaxSearchRadiusKm=${MODE_ONDEMAND_H3_MAX_KM:-12}" \
        -e "BookingSettings__DeliveryModes__OnDemand__PulseIntervalFreshSeconds=${MODE_ONDEMAND_PULSE_FRESH:-5}" \
        -e "BookingSettings__DeliveryModes__OnDemand__PulseIntervalWarmSeconds=${MODE_ONDEMAND_PULSE_WARM:-10}" \
        -e "BookingSettings__DeliveryModes__OnDemand__PulseIntervalCoolSeconds=${MODE_ONDEMAND_PULSE_COOL:-20}" \
        -e "BookingSettings__DeliveryModes__OnDemand__PulseIntervalStaleSeconds=${MODE_ONDEMAND_PULSE_STALE:-45}" \
        -e "BookingSettings__DeliveryModes__OnDemand__OfferExpirationManyDriversMinutes=${MODE_ONDEMAND_TTL_MANY:-1}" \
        -e "BookingSettings__DeliveryModes__OnDemand__OfferExpirationFewDriversMinutes=${MODE_ONDEMAND_TTL_FEW:-2}" \
        -e "BookingSettings__DeliveryModes__OnDemand__NoDriverRetryMinutes=${MODE_ONDEMAND_NO_DRIVER_RETRY:-2}" \
        -e "BookingSettings__DeliveryModes__OnDemand__QualityScoreWeight=${MODE_ONDEMAND_QUALITY_WEIGHT:-0.35}" \
        -e "BookingSettings__DeliveryModes__OnDemand__QualityScoreWindowDays=${MODE_ONDEMAND_QUALITY_WINDOW_DAYS:-14}" \
        -e "BookingSettings__DeliveryModes__OnDemand__QualityScoreMinSamples=${MODE_ONDEMAND_QUALITY_MIN_SAMPLES:-5}" \
        -e "BookingSettings__DeliveryModes__Pooling__MaxBroadcastMinutes=${MODE_POOLING_MAX_BROADCAST_MINUTES:-25}" \
        -e "BookingSettings__DeliveryModes__Pooling__OfferExpirationFewDriversMinutes=${MODE_POOLING_TTL_FEW:-8}" \
        -e "BookingSettings__DeliveryModes__Pooling__PulseIntervalWarmSeconds=${MODE_POOLING_PULSE_WARM:-60}" \
        -e "BookingSettings__DeliveryModes__Pooling__PoolingScoreWeight=${MODE_POOLING_SCORE_WEIGHT:-0.35}" \
        -e "BookingSettings__DeliveryModes__Pooling__MaxDetourKm=${MODE_POOLING_MAX_DETOUR_KM:-4.0}" \
        -e "BookingSettings__DeliveryModes__Pooling__PoolingCandidateLimit=${MODE_POOLING_CANDIDATE_LIMIT:-45}" \
        -e "Features__DisableRateLimiting=${FEATURES__DISABLE_RATE_LIMITING:-true}" \
        -e "Location__UpdateBurstAllowance=${LOCATION_UPDATE_BURST_ALLOWANCE:-0}" \
        --network beeapp-network ${DOCKER_IMAGE_NAME}:${DOCKER_TAG}
      # Rate limiting is OFF on dev (#76), and it takes both vars above because two independent
      # limiters are involved. Neither can be turned off from appsettings.Development.json:
      # .gitignore:88-89 ignores appsettings.*.json, so that file never reaches the built image
      # and Features:DisableRateLimiting silently falls back to its hardcoded false.
      #   Features__DisableRateLimiting  -> short-circuits RateLimitingMiddleware (100/min general
      #     bucket, which covers /api/config, /api/mqtt/credentials and /api/locations/update).
      #   Location__UpdateBurstAllowance -> 0 trips the burstCapacity<=0 bypass in
      #     DriverLocationStateTracker.TryConsumeUpdateAllowance, disabling the per-driver 1/s
      #     bucket in LocationSanitizer that rejects MQTT fixes from any driver over ~36 km/h.
      # Both default to on-for-dev so no CI variable is needed; set the CI variables to override.
      # Staging keeps its own conditional hook below and production stays rate limited.
      # SECRETS now in Vault bee/config (NOT passed here): ConnectionStrings__DefaultConnection,
      # JwtSettings__Secret, Email__Password, Xendit__ApiKey/WebhookToken,
      # PayMongo__SecretKey/WebhookSecret/SourceAccountNumber/SourceAccountName/SourceAccountBic,
      # RabbitMQ__Username/Password,
      # Mqtt__Username/Password, S3__AccessKey/SecretKey, DigitalOcean__AccessKey/SecretKey, Zammad__ApiToken/WebhookSecret,
      # PhilSMS__ApiToken, Sms__Providers__*__ApiToken/ApiKey, Seed__DefaultPassword,
      # Matrix__AsToken/HsToken/AdminToken.
    - echo "DEV Deployment completed!"
    - docker ps | grep ${CONTAINER_NAME}
  environment:
    name: dev
    url: https://dev-api.bee-app.tech
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

