    - echo "RABBITMQ_CONTAINER=beeapp-rabbitmq" >> build.env
    # Future reference (per-environment isolation):
    # - echo "REDIS_CONTAINER=beeapp-redis-staging" >> build.env
    # - echo "REDIS_PORT=6380" >> build.env
    # - echo "RABBITMQ_CONTAINER=beeapp-rabbitmq-staging" >> build.env
