# GitLab CI/CD Pipeline for Bee Logistics Backend
# Multi-environment deployment: dev, staging, production (main branch)
# Manual deployment with play button

# When pipelines run (catch defects early):
# - Push to main, dev, or staging: full pipeline for that branch (security → restore → build → sast → publish → docker).
# - Merge Request (MR) into main, dev, or staging: pipeline runs security + restore → build → sast → publish (no env-specific prepare/docker/deploy).
# You will see the pipeline under Build → Pipelines (and on the MR page).

# Security checks (all branches + MRs): Gitleaks (secrets), Checkov (Dockerfile IAC), SAST (vulnerable NuGet).
# Docker builds (dev/staging/main): Trivy CVE scan + Syft SBOM on the built image.

# Runner routing: the whole pipeline runs on the runner tag picked below.
# - main (production): runner tagged `production`
# - dev / staging / MRs: runner tagged `dev` (temporary — change RUNNER_TAG below when the
#   dedicated dev/staging runner tags are ready)
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        RUNNER_TAG: "production"
    - if: $CI_COMMIT_BRANCH == "dev"
      variables:
        RUNNER_TAG: "dev"
    - if: $CI_COMMIT_BRANCH == "staging"
      variables:
        RUNNER_TAG: "dev"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        RUNNER_TAG: "dev"

default:
  tags:
    - $RUNNER_TAG

stages:
  - prepare
  - security
  - restore
  - build
  - test
  - sast
  - publish
  - docker
  - deploy
  # - dast  # disabled for now — see commented DAST section at the bottom

variables:
  # Build Configuration (non-sensitive, shared across environments)
  DOTNET_VERSION: "10.0"
  # Single source of truth for the .NET image tag: the SDK that compiles the app and the
  # runtime base image in Dockerfile.ci must be the same tag, otherwise the published app
  # will not start. Change both by changing this.
  DOTNET_IMAGE_TAG: "10.0-preview"
  SOLUTION_FILE: "bee-app-backend.sln"
  API_PROJECT: "src/BeeLogistics.Api/BeeLogistics.Api.csproj"
  TEST_PROJECT: "tests/BeeLogistics.Tests/BeeLogistics.Tests.csproj"
  PUBLISH_OUTPUT_DIR: "publish"
  DOCKER_IMAGE_NAME: "beelogistics-api"

  # Every dotnet invocation shares one NuGet package directory, bind-mounted from the
  # runner host at /nuget so it persists across jobs and pipelines. Previously only the
  # `restore` job used .nuget/ and every other job re-downloaded packages into
  # ~/.nuget/packages, which nothing ever cached.
  NUGET_PACKAGES: "/nuget"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

  # Non-sensitive shared config
  JWT_ISSUER: "BeeLogisticsApi"
  JWT_AUDIENCE: "BeeLogisticsClient"
  JWT_EXPIRY_MINUTES: "60"
  EMAIL_USE_SSL: "true"
  MQTT_USE_SSL: "false"
  MQTT_IGNORE_CERTIFICATE_ERRORS: "true"
  RABBITMQ_PORT: "5672"

  # ============================================
  # SECRETS now come from HashiCorp Vault (KV v2 secret `bee/config`).
  # The container only authenticates to Vault and fetches them at startup.
  # ============================================
  # GitLab CI/CD Variables required (Settings > CI/CD > Variables) — full list in .env.gitlab.ci:
  #   VAULT_ADDRESS         (e.g. https://10.10.10.117:8200)
  #   VAULT_ROLE_ID         (AppRole role_id; scope per environment; Masked)
  #   VAULT_SECRET_ID       (AppRole secret_id; scope per environment; Masked, Protected)
  #   VAULT_SKIP_TLS_VERIFY (true for dev/staging self-signed; false once Vault has a trusted cert)
  #   RABBITMQ_USER         (used to CREATE the rabbitmq container; MUST match Vault bee/config)
  #   RABBITMQ_PASSWORD     (used to CREATE the rabbitmq container; MUST match Vault bee/config)
  #
  # NO LONGER set here (moved to Vault bee/config): POSTGRES_*, JWT_SECRET, EMAIL_PASSWORD,
  # XENDIT_API_KEY, XENDIT_WEBHOOK_TOKEN, S3_ACCESS_KEY, S3_SECRET_KEY, DIGITALOCEAN_ACCESS_KEY,
  # DIGITALOCEAN_SECRET_KEY, ZAMMAD_API_TOKEN,
  # ZAMMAD_WEBHOOK_SECRET, MQTT_USERNAME, MQTT_PASSWORD, PHILSMS_API_TOKEN, SMS_ILOCOS_API_KEY,
  # SEED_DEFAULT_PASSWORD, and the PayMongo secrets: PayMongo__SecretKey, PayMongo__WebhookSecret,
  # PayMongo__SourceAccountNumber, PayMongo__SourceAccountName, PayMongo__SourceAccountBic.
  #
  # IMPORTANT: each environment's Vault bee/config must hold THAT environment's values
  # (its own DB connection string, Redis connstring, RabbitMQ creds, etc.).
  # ============================================

# NOTE: there is deliberately no `cache:` block.
#
# NuGet packages live on a host directory bind-mounted into every job at /nuget
# (see NUGET_PACKAGES above and the runner's [runners.docker] volumes). That is faster
# than GitLab's cache — nothing is zipped, uploaded or downloaded — and it sidesteps the
# whole class of problems that made the previous cache unreliable: cache volume naming,
# protected/unprotected key segregation, and runner volume cleanup (volume_keep).
#
# The runner requires:
#   volumes = ["/srv/gitlab-runner/nuget:/nuget", "/var/run/docker.sock:/var/run/docker.sock"]

# Guard for every job that runs dotnet with --no-restore.
#
# Populates /nuget on first ever use, and keeps the pipeline correct if the mount is
# missing or has been emptied — without it, dotnet fails with NETSDK1064 (package not
# found) rather than just running slower. In steady state this is a no-op.
.dotnet_restore_guard: &dotnet_restore_guard
  - |
    if [ ! -d "$NUGET_PACKAGES" ] || [ -z "$(ls -A "$NUGET_PACKAGES" 2>/dev/null)" ]; then
      echo "NuGet packages missing at $NUGET_PACKAGES — restoring inline. If you see this on every job, the runner's /nuget bind mount is not configured."
      dotnet restore "$SOLUTION_FILE"
    else
      echo "NuGet cache hit at $NUGET_PACKAGES"
    fi

# ============================================
# PREPARE STAGE - Generate environment config
# ============================================

prepare:env:dev:
  stage: prepare
  image: alpine:latest
  script:
    - echo "ENV_NAME=dev" > build.env
    - echo "ASPNETCORE_ENVIRONMENT=Development" >> build.env
    - echo "POSTGRES_DB=bee_logistics_db_dev" >> build.env
    - echo "API_PORT=8081" >> build.env
    - echo "CONTAINER_NAME=beeapp-backend-dev" >> build.env
    - echo "DOCKER_TAG=dev" >> build.env
    - echo "MQTT_ENV=dev" >> build.env
    - echo "MQTT_LOCATION_TOPIC=dev/beelogistics/drivers/+/location" >> build.env
    # Shared broker/cache across all environments (temporary)
    - echo "REDIS_CONTAINER=beeapp-redis" >> build.env
    - echo "REDIS_PORT=6379" >> build.env
    - echo "RABBITMQ_CONTAINER=beeapp-rabbitmq" >> build.env
    # Future reference (per-environment isolation):
    # - echo "REDIS_CONTAINER=beeapp-redis-dev" >> build.env
    # - echo "REDIS_PORT=6379" >> build.env
    # - echo "RABBITMQ_CONTAINER=beeapp-rabbitmq-dev" >> build.env
    - echo "FRONTEND_URL=https://dev.bee-app.tech" >> build.env
    - echo "BACKOFFICE_URL=https://dev-backoffice.bee-app.tech" >> build.env
    - echo "API_URL=https://dev-api.bee-app.tech" >> build.env
    - echo "FRONTEND_URL_DEV=http://localhost:3002" >> build.env
    - echo "BACKOFFICE_URL_DEV=http://localhost:3005" >> build.env
    - echo "PROXIMITY_RADIUS_KM=${PROXIMITY_RADIUS_KM:-35}" >> build.env
    - cat build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

