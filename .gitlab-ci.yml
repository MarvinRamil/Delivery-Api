# ============================================
# SECURITY STAGE - Secrets scan, IAC scan (all branches + MRs)
# ============================================

# ============================================
# REVIEW APPS - one environment per merge request, at <mr-iid>.bee-app.tech
# ============================================
# Routing needs no CI involvement: the container declares VIRTUAL_HOST and nginx-proxy on the
# app server picks it up off the Docker socket. A stopped container drops out of routing by
# itself, so there is no per-MR proxy config to create, and none to leak when a stop job fails.
#
#   Cloudflare (*.bee-app.tech, proxied) -> NPM wildcard host -> 10.10.10.3:80 (nginx-proxy)
#     -> beeapp-backend-review-<iid> on beeapp-network
prepare:env:review:
  stage: prepare
  image: alpine:latest
  before_script:
    - apk add --no-cache git >/dev/null
  script:
    # Only genuinely computed values go in build.env. GitLab caps a dotenv artifact at 20
    # variables, and per-environment constants live in deploy:review's own variables: block.
    - echo "ENV_NAME=review-${CI_MERGE_REQUEST_IID}" > build.env
    - echo "CONTAINER_NAME=beeapp-backend-review-${CI_MERGE_REQUEST_IID}" >> build.env
    - echo "DOCKER_TAG=mr-${CI_MERGE_REQUEST_IID}" >> build.env
    # The api- prefix namespaces this project. bee-backend and bee-frontend are separate
    # GitLab projects with independent MR numbering, so a bare <iid>.bee-app.tech would let
    # backend !107 and frontend !107 claim one hostname - whichever deployed last silently
    # taking it. Frontend review apps use web-<iid>.
    - echo "VIRTUAL_HOST=api-${CI_MERGE_REQUEST_IID}.bee-app.tech" >> build.env
    - echo "API_URL=https://api-${CI_MERGE_REQUEST_IID}.bee-app.tech" >> build.env
    # Its own broker vhost, so a review app cannot compete with dev for the same queues.
    # MassTransit derives queue names from consumer type names, so without this every open MR
    # would bind dev's queues and RabbitMQ would round-robin messages between them.
    - echo "RABBITMQ_VHOST=review-${CI_MERGE_REQUEST_IID}" >> build.env
    - echo "SIGNALR_CHANNEL_PREFIX=BeeLogistics:signalr:review-${CI_MERGE_REQUEST_IID}:" >> build.env
    # Subscribes to a topic nobody publishes to, so a review app does not double-ingest dev's
    # driver locations into the shared database. Location testing is therefore not available in
    # a review app unless a driver build is pointed at this topic.
    - echo "MQTT_ENV=review-${CI_MERGE_REQUEST_IID}" >> build.env
    - echo "MQTT_LOCATION_TOPIC=review-${CI_MERGE_REQUEST_IID}/beelogistics/drivers/+/location" >> build.env
    - |
      # Share dev's database, EXCEPT when this MR changes the schema.
      #
      # A review app runs MigrateAsync() at startup against whatever database it points at. An MR
      # that adds a migration would therefore apply it to the real dev database before review --
      # and if that MR is then revised or abandoned, dev is left carrying a schema change that
      # exists on no branch. EF does not complain, so it surfaces later as a confusing mismatch.
      #
      # So: no migrations -> share dev and get real data for free. Migrations -> isolated database,
      # created by EF on first boot and dropped by stop:review.
      git fetch --quiet origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" || true
      if git diff --name-only "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}...HEAD" | grep -q '/Migrations/'; then
        echo "This MR changes the schema -> isolated database"
        echo "POSTGRES_DB=bee_review_${CI_MERGE_REQUEST_IID}" >> build.env
        echo "OWNS_DATABASE=true" >> build.env
      else
        echo "No migration changes -> sharing bee_logistics_db_dev"
        echo "POSTGRES_DB=bee_logistics_db_dev" >> build.env
        echo "OWNS_DATABASE=false" >> build.env
      fi
    - cat build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

docker:build:review:
  stage: docker
  image: docker:latest
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  needs:
    - job: publish
      artifacts: true
    - job: prepare:env:review
      artifacts: true
  script:
    - echo "Building image for MR !${CI_MERGE_REQUEST_IID}..."
    - docker build -f Dockerfile.ci --build-arg DOTNET_IMAGE_TAG=${DOTNET_IMAGE_TAG} -t ${DOCKER_IMAGE_NAME}:${DOCKER_TAG} ${PUBLISH_OUTPUT_DIR}
    - docker images | grep ${DOCKER_IMAGE_NAME}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

deploy:review:
  stage: deploy
  image: docker:latest
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    # Per-environment constants. Kept out of the dotenv artifact deliberately - GitLab caps that
    # at 20 variables, and these are fixed values rather than anything prepare computes.
    ASPNETCORE_ENVIRONMENT: "Development"
    REDIS_CONTAINER: "beeapp-redis"
    REDIS_PORT: "6379"
    RABBITMQ_CONTAINER: "beeapp-rabbitmq"
    FRONTEND_URL: "https://dev.bee-app.tech"
    BACKOFFICE_URL: "https://dev-backoffice.bee-app.tech"
    FRONTEND_URL_DEV: "http://localhost:3002"
    BACKOFFICE_URL_DEV: "http://localhost:3005"
    # Matrix is OFF for review apps. Only dev has an appservice registered on the homeserver, and
    # a review app sharing dev's database would provision rooms into dev's @bee_u_dev_* namespace.
    # Per-MR chat would need a registration per MR, which is not practical.
    MATRIX_ENABLED: "false"
    # Tag review-app errors so they are filterable in GlitchTip and do not read as dev noise.
    # The DSN itself still comes from Vault (bee/config), like every other environment.
    SENTRY_ENVIRONMENT: "review-$CI_MERGE_REQUEST_IID"
  needs:
    - job: docker:build:review
    - job: prepare:env:review
      artifacts: true
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    url: https://api-$CI_MERGE_REQUEST_IID.bee-app.tech
    on_stop: stop:review
    # An abandoned MR must not hold a container and a database indefinitely. The Proxmox host runs
    # 1.66x RAM overcommit, so unbounded review apps would eat the balloon headroom.
    auto_stop_in: 3 days
  script:
    - echo "Deploying review app for MR !${CI_MERGE_REQUEST_IID} -> https://${VIRTUAL_HOST}"
    - echo "Database - ${POSTGRES_DB} (owned by this MR - ${OWNS_DATABASE})"
    - docker network create beeapp-network || true
    - docker start ${REDIS_CONTAINER} || true
    - docker start ${RABBITMQ_CONTAINER} || true
    - docker exec ${RABBITMQ_CONTAINER} rabbitmqctl add_vhost "${RABBITMQ_VHOST}" || true
    - |
      # Same grant as deploy:dev: every user that exists in the broker. The app's credentials come
      # from Vault and CI cannot see them, so "whoever exists" is the only reliable rule.
      # --no-table-headers matters: -q alone still prints the column header.
      RMQ="docker exec ${RABBITMQ_CONTAINER} rabbitmqctl"
      USERS=$($RMQ -q --no-table-headers list_users 2>/dev/null | awk '{print $1}' | grep -v '^$' || true)
      if [ -z "$USERS" ]; then
        USERS=$($RMQ -q list_users | awk 'NR>1 {print $1}' | grep -v '^$' || true)
      fi
      GRANTED=0
      for u in $USERS; do
        $RMQ set_permissions -p "${RABBITMQ_VHOST}" "$u" ".*" ".*" ".*" && GRANTED=$((GRANTED+1)) || true
      done
      if [ "$GRANTED" -eq 0 ]; then
        echo "Could not grant any user on vhost '${RABBITMQ_VHOST}'; the app could not reach the broker."
        exit 1
      fi
    - docker stop ${CONTAINER_NAME} || true
    - docker rm ${CONTAINER_NAME} || true
    # Hangfire__EnableServer follows OWNS_DATABASE: a review app sharing bee_logistics_db_dev shares
    # its hangfire schema too, and a second Hangfire server there works on data it does not own (#98).
    - echo "Starting review container (secrets come from Vault)..."
    # NOTE: no comments inside the `docker run ... \` continuation below. A "#" line after a
    # trailing backslash ends the command there and silently drops the rest, image included.
    - |
      docker run -d --name ${CONTAINER_NAME} --restart unless-stopped \
        -e "VIRTUAL_HOST=${VIRTUAL_HOST}" -e "VIRTUAL_PORT=8080" \
        -e ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT} -e ASPNETCORE_URLS=http://+:8080 \
        -e "Hangfire__EnableServer=${OWNS_DATABASE:-false}" \
        -e "Vault__Address=${VAULT_ADDRESS}" -e "Vault__RoleId=${VAULT_ROLE_ID}" -e "Vault__SecretId=${VAULT_SECRET_ID}" -e "Vault__SkipTlsVerify=${VAULT_SKIP_TLS_VERIFY:-true}" \
        -e "Cors__AllowedOrigins__0=${FRONTEND_URL}" -e "Cors__AllowedOrigins__1=${BACKOFFICE_URL}" -e "Cors__AllowedOrigins__2=${FRONTEND_URL_DEV}" -e "Cors__AllowedOrigins__3=${BACKOFFICE_URL_DEV}" -e "Cors__AllowedOrigins__4=${API_URL}" \
        -e "ConnectionStrings__Redis=${REDIS_CONTAINER}:${REDIS_PORT}${REDIS_PASSWORD:+,password=${REDIS_PASSWORD}}${REDIS_DB:+,defaultDatabase=${REDIS_DB}}" -e "Redis__ConnectionString=${REDIS_CONTAINER}:${REDIS_PORT}${REDIS_PASSWORD:+,password=${REDIS_PASSWORD}}${REDIS_DB:+,defaultDatabase=${REDIS_DB}}" \
        -e "JwtSettings__Issuer=${JWT_ISSUER}" -e "JwtSettings__Audience=${JWT_AUDIENCE}" -e "JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES}" \
        -e "Email__Host=${EMAIL_HOST}" -e "Email__Port=${EMAIL_PORT}" -e "Email__Username=${EMAIL_USERNAME}" -e "Email__From=${EMAIL_FROM}" -e "Email__UseSsl=${EMAIL_USE_SSL}" \
        -e "Payments__ActiveGateway=${PAYMENTS_ACTIVE_GATEWAY:-paymongo}" \
        -e "PayMongo__BaseUrl=${PAYMONGO_BASE_URL:-https://api.paymongo.com/}" \
        -e "PayMongo__CheckoutSuccessUrl=${PAYMONGO_CHECKOUT_SUCCESS_URL}" -e "PayMongo__CheckoutCancelUrl=${PAYMONGO_CHECKOUT_CANCEL_URL}" \
        -e "PayMongo__DefaultTransferProvider=${PAYMONGO_TRANSFER_PROVIDER:-instapay}" \
        -e "Xendit__BaseUrl=${XENDIT_BASE_URL:-https://api.xendit.co/}" \
        -e "RabbitMQ__Host=${RABBITMQ_CONTAINER}" -e "RabbitMQ__Port=${RABBITMQ_PORT}" -e "RabbitMQ__VirtualHost=${RABBITMQ_VHOST}" -e "SignalR__ChannelPrefix=${SIGNALR_CHANNEL_PREFIX}" \
        -e "Mqtt__Host=${MQTT_HOST}" -e "Mqtt__Port=${MQTT_PORT}" -e "Mqtt__UseSsl=${MQTT_USE_SSL}" -e "Mqtt__IgnoreCertificateErrors=${MQTT_IGNORE_CERTIFICATE_ERRORS}" -e "Mqtt__Environment=${MQTT_ENV}" -e "Mqtt__LocationTopic=${MQTT_LOCATION_TOPIC}" \
        -e "ClamAV__Enabled=${CLAMAV_ENABLED:-true}" -e "ClamAV__Host=${CLAMAV_HOST:-localhost}" -e "ClamAV__Port=${CLAMAV_PORT:-3310}" -e "ClamAV__TimeoutSeconds=${CLAMAV_TIMEOUT_SECONDS:-30}" \
        -e "S3__Endpoint=${S3_ENDPOINT:-}" -e "S3__CdnEndpoint=${S3_CDN_ENDPOINT:-}" -e "S3__Region=${S3_REGION:-auto}" -e "S3__UseSSL=${S3_USE_SSL:-true}" -e "S3__BucketName=${S3_BUCKET_NAME:-}" -e "S3__ObjectKeyPrefix=${S3_OBJECT_KEY_PREFIX:-}" \
        -e "DigitalOcean__Endpoint=${DIGITALOCEAN_ENDPOINT:-}" -e "DigitalOcean__CdnEndpoint=${DIGITALOCEAN_CDN_ENDPOINT:-}" -e "DigitalOcean__Region=${DIGITALOCEAN_REGION:-sgp1}" -e "DigitalOcean__UseSSL=${DIGITALOCEAN_USE_SSL:-true}" -e "DigitalOcean__BucketName=${DIGITALOCEAN_BUCKET_NAME:-}" -e "DigitalOcean__ObjectKeyPrefix=${DIGITALOCEAN_OBJECT_KEY_PREFIX:-}" \
        -e "FileStorage__Provider=${FILE_STORAGE_PROVIDER:-DigitalOcean}" \
        -e "Zammad__BaseUrl=${ZAMMAD_BASE_URL:-http://10.10.10.91:9080}" -e "Zammad__Enabled=${ZAMMAD_ENABLED:-true}" \
        -e "Matrix__Enabled=${MATRIX_ENABLED:-false}" -e "Matrix__HomeserverUrl=${MATRIX_HOMESERVER_URL}" -e "Matrix__PublicHomeserverUrl=${MATRIX_PUBLIC_HOMESERVER_URL:-}" -e "Matrix__ServerName=${MATRIX_SERVER_NAME:-}" -e "Matrix__EnvironmentPrefix=${MATRIX_ENVIRONMENT_PREFIX:-}" -e "Matrix__AppServiceId=${MATRIX_APPSERVICE_ID:-}" -e "Matrix__SenderLocalpart=${MATRIX_SENDER_LOCALPART:-}" -e "Matrix__AdminApiUrl=${MATRIX_ADMIN_API_URL:-}" \
        -e "SEQ_SERVER_URL=${SEQ_SERVER_URL:-}" \
        -e "Sentry__Dsn=${SENTRY_DSN:-}" -e "SENTRY_RELEASE=${CI_COMMIT_SHORT_SHA}" -e "SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT}" \
        -e "Serilog__MinimumLevel__Override__Sentry=${SERILOG_SENTRY_LEVEL:-Warning}" \
        -e "Sms__Providers__IlocosSms__ApiBaseUrl=${SMS_ILOCOS_API_BASE_URL:-https://sms.ilocosscript.live}" -e "Sms__Providers__PhilSMS__ApiBaseUrl=${PHILSMS_API_BASE_URL:-https://dashboard.philsms.com/api/v3}" -e "Sms__Providers__PhilSMS__SenderId=${PHILSMS_SENDER_ID:-BeeOnDemand}" \
        -e "PhilSMS__ApiBaseUrl=${PHILSMS_API_BASE_URL:-https://dashboard.philsms.com/api/v3}" -e "PhilSMS__SenderId=${PHILSMS_SENDER_ID:-BeeOnDemand}" \
        -e "BookingSettings__ProximityRadiusKm=${PROXIMITY_RADIUS_KM:-35}" \
        -e "BookingSettings__ScheduledClaimLeadMinutes=${SCHEDULED_CLAIM_LEAD_MINUTES:-45}" \
